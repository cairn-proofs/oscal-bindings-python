[build-system]
# Exact pin: build isolation fetches the backend fresh, and no lockfile covers it.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
# Distribution name matches the import package (`oscal_bindings`). The repo carries
# the language suffix (oscal-bindings-python) because sibling bindings in other
# languages share the cairn-proofs org; package registries don't need it.
name = "oscal-bindings"
version = "0.3.1"
description = "Typed Python data bindings for OSCAL, generated from the NIST JSON Schema"
readme = "README.md"
# PEP 639 license expression; no License :: classifier alongside it.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Name only, no email: published metadata can't be edited after upload, and
# contact goes through [project.urls] (issues).
authors = [{ name = "Fritz Kunstler" }]
keywords = ["oscal", "GRC engineering", "compliance automation", "security controls", "security assurance", "compliance as code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.11"
# Upper bound is deliberate: the generated models break on pydantic 2.14+ (its
# parametrized RootModel classes leak into the models namespace on 3.11, which
# the model tripwire tests reject). Lift the bound only after the models support
# 2.14; that work and the removal are tracked in issue #11. tests/test_pydantic_version.py
# fails first with a pointer here if an install slips past the bound.
dependencies = ["pydantic[email]>=2.11,<2.14"]

[project.urls]
Homepage = "https://github.com/cairn-proofs/oscal-bindings-python"
Source = "https://github.com/cairn-proofs/oscal-bindings-python"
Issues = "https://github.com/cairn-proofs/oscal-bindings-python/issues"

[project.optional-dependencies]
codegen = ["datamodel-code-generator[http,black,isort]==0.83.0"]

# Every Hatch env installs from a hatch-pip-compile lockfile (requirements.txt for
# default, requirements/requirements-<env>.txt otherwise). Hatch re-locks when an
# env's declared dependencies change; upgrade deliberately with `hatch run
# upgrade` (see the `lock`/`upgrade` scripts below). Transitive pins matter
# here: datamodel-code-generator formats its output with black and isort, so an
# unlocked env can change v1/models.py without any change in this repo.
[tool.hatch.envs.default]
type = "pip-compile"
pip-compile-resolver = "uv"
pip-compile-installer = "uv"
pip-compile-hashes = true
python = "3.14"
# pytest is deliberately absent: tests run in hatch-test (`hatch test`), whose
# built-in pytest range is Hatch's to choose.
dependencies = [
    "mypy",
    "datamodel-code-generator[http,black,isort]==0.83.0",
    "pdoc",
    "ruff==0.16.8",
    # `generate` validates names.json against its JSON Schema before codegen.
    "jsonschema-rs==0.58.6",
]

[tool.hatch.envs.default.scripts]
generate = "python scripts/hoist_names.py && datamodel-codegen --input ./build/codegen/oscal_complete_schema.json --output ./build/codegen/models.py --input-file-type jsonschema --output-model-type pydantic_v2.BaseModel --base-class oscal_bindings.v1._base.OscalBaseModel --collapse-root-models --use-annotated --field-constraints --target-python-version 3.11 --use-schema-description --disable-timestamp --formatters black isort && python scripts/postprocess_models.py --models ./build/codegen/models.py --output src/oscal_bindings/v1/models.py"
docs = "pdoc oscal_bindings oscal_bindings.v1 -o build/api-docs"
# No --install-types: it would pip-install stubs at run time, outside the lockfile.
# Add any stub packages mypy needs to `dependencies` above instead.
typing = "mypy src/oscal_bindings"
lint = [
    "ruff check .",
    "ruff format --check .",
]
security = ["hatch run security:scan-code", "hatch run security:scan-deps"]
# `lock` touches every locked env, re-locking any whose lockfile is stale
# (declared deps or its constraint file changed) and upgrading nothing; run it
# after editing dependencies here. `upgrade` is the same pass with
# PIP_COMPILE_UPGRADE=1, which forces a re-resolve of every env to the newest
# versions its declared ranges allow. Order matters: default first, because
# hatch-test is constrained by it. Exact `==` pins (codegen, ruff, bandit,
# pip-audit, hatchling, hatch-pip-compile) don't move; bump those by hand.
# After either: review the lockfile diff, then `hatch run release` (its
# `generate` step surfaces any black/isort drift in v1/models.py).
lock = [
    "hatch env run --env default -- python --version",
    # One per matrix entry; keep in step with [[tool.hatch.envs.hatch-test.matrix]].
    "hatch env run --env hatch-test.py3.11 -- python --version",
    "hatch env run --env hatch-test.py3.12 -- python --version",
    "hatch env run --env hatch-test.py3.13 -- python --version",
    "hatch env run --env hatch-test.py3.14 -- python --version",
    "hatch env run --env hatch-build -- python --version",
    "hatch env run --env security -- python --version",
]
upgrade = "PIP_COMPILE_UPGRADE=1 hatch run lock"
release = ["generate", "lint", "typing", "security", "hatch test --all --cover", "docs"]

[tool.hatch.envs.hatch-test]
type = "pip-compile"
pip-compile-resolver = "uv"
pip-compile-installer = "uv"
pip-compile-hashes = true
# Resolve shared deps (pydantic, pytest, ...) to the same versions as default.
pip-compile-constraint = "default"
parallel = true
extra-dependencies = ["hypothesis", "jsonschema-rs"]

# Hatch runs cov-combine and then cov-report once after `hatch test --cover`.
# cov-report adds the HTML report ([tool.coverage.html] sets the directory)
# alongside the terminal one. Declaring this table REPLACES Hatch's built-in
# scripts rather than merging, so run/run-cov/cov-combine restate its defaults.
[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = ["coverage report", "coverage html"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes"]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["oscal_bindings"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# Check against the oldest supported Python, not the interpreter mypy runs on
# (the default env's 3.14), so 3.12+ stdlib/typing APIs fail `hatch run typing`.
# Keep in step with requires-python, like ruff's target-version below.
[tool.mypy]
python_version = "3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
# Top-level so both the linter and the formatter honor it; `extend-exclude`
# (not `exclude`) keeps Ruff's default exclusion list intact.
extend-exclude = ["./build", ".hatch", "src/oscal_bindings/v1/models.py", "*.md"]
# Honor exclusions even when a path is named explicitly on the command line,
# so the generated module is never rewritten by a targeted invocation.
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
isort.known-first-party = ["oscal_bindings"]
select = [
  "F", "E", "W",        # pyflakes, pycodestyle
  "I",                  # isort
  "N",                  # pep8-naming
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "A",                  # flake8-builtins
  "C4",                 # flake8-comprehensions
  "DTZ",                # flake8-datetimez
  "EM",                 # flake8-errmsg        <- keeps EM101 active
  "EXE", "FA", "ICN", "ISC", "PIE", "PYI", "PT", "RSE", "RET", "SLF", "SIM",
  "INP",                # flake8-no-pep420     <- keeps INP001 active
  "T20",                # flake8-print         <- keeps T201 active
  "TID",                # flake8-tidy-imports  <- keeps TID252 active
  "TC",                 # flake8-type-checking
  "S",                  # flake8-bandit        <- keeps S101 active
  "ARG", "PTH", "PGH", "FLY", "PERF", "FURB", "RUF",
  "PL",                 # pylint               <- keeps PLR2004, PLC0415 active
  "TRY",                # tryceratops          <- keeps TRY003 active
]
ignore = ["ISC001"]     # implicit-str-concat: documented formatter conflict

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252", "PLC0415", "INP001"]
# Build/codegen scripts report progress and errors on stdout/stderr. scripts/ is
# intentionally not a package (like tests/), so INP001 does not apply.
"scripts/**/*" = ["T201", "INP001"]
# collapse_scalar_root_models() is a single-pass line scanner: its branches are the
# cases of one state machine over the generated source, sharing one cursor (`i`).
# Splitting it would scatter that shared cursor state across helpers.
"scripts/postprocess_models.py" = ["PLR0912", "PLR0915"]
# Inline exception messages. A deferral, not a blessing: these findings flag a
# real API weakness (typed parsers raise a flat OscalParseError on a document-type
# mismatch), to be fixed with a dedicated WrongDocumentTypeError.
"src/oscal_bindings/v1/**" = ["EM101", "EM102", "TRY003"]
# PEP 484 explicit re-export idiom (`import X as X`) — correct in a compat shim
"src/oscal_bindings/__init__.py" = ["PLC0414"]

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscal_bindings"]

# Explicit allowlist: without it Hatch ships every non-gitignored file, including
# untracked ones. The sdist holds what's needed to build the wheel, regenerate
# models, and run the tests under the locked envs. Repo-only material (.kiro/,
# .agents/, AGENTS.md, mise.toml) stays out. The schema is not in the sdist:
# generate and the tests fetch it from the spec artifact pinned in
# scripts/spec_artifact.py. pyproject.toml and PKG-INFO are always added;
# declared license-files are added automatically.
[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "scripts",
  "requirements.txt",
  "requirements",
  "README.md",
  "DEVELOPING.md",
]

[tool.hatch.envs.hatch-build]
type = "pip-compile"
pip-compile-resolver = "uv"
pip-compile-installer = "uv"
pip-compile-hashes = true

# Security scanners get their own env and lockfile: adding their transitive deps
# to `default` would leak those pins into hatch-test through its constraint.
# Detached, so the project isn't installed: bandit reads source, and pip-audit
# audits the committed lockfiles rather than this env.
[tool.hatch.envs.security]
type = "pip-compile"
pip-compile-resolver = "uv"
pip-compile-installer = "uv"
pip-compile-hashes = true
python = "3.14"
detached = true
dependencies = ["bandit==1.9.4", "pip-audit==2.10.1"]

[tool.hatch.envs.security.scripts]
# Covers the generated models too: codegen output ships, so it gets scanned.
#
# Script names must differ from the commands: Hatch expands a script name that
# appears as a command's first word, so `bandit = "bandit ..."` recurses.
scan-code = "bandit -c pyproject.toml -r src scripts"
# Every committed lockfile, named explicitly (no globbing), so a dev-only,
# build-only, or scanner vulnerability fails the release as well as a runtime one.
# --disable-pip + --require-hashes audit the pins exactly as locked, with no
# re-resolution or throwaway venv; --strict fails if any package can't be audited.
# -s osv: the default PyPI source lacked advisories OSV carries (checked against
# datamodel-code-generator 0.59.0: 10 IDs from PyPI vs 12 from OSV). With OSV,
# --require-hashes checks hash presence only (pip-audit warns); hash validity is
# enforced where it matters, when uv installs from these lockfiles.
scan-deps = "pip-audit -s osv --strict --disable-pip --require-hashes -r requirements.txt -r requirements/requirements-hatch-test.py3.11.txt -r requirements/requirements-hatch-test.py3.12.txt -r requirements/requirements-hatch-test.py3.13.txt -r requirements/requirements-hatch-test.py3.14.txt -r requirements/requirements-hatch-build.txt -r requirements/requirements-security.txt"

[tool.bandit]
# Each skip needs a justification.
# B105 (hardcoded_password_string): false positive on the generated OSCAL enum
# member `pass_ = 'pass'` in v1/models.py, which can't carry a `# nosec`. Ruff's
# S105 (same check) stays active on all hand-written code.
skips = ["B105"]

[tool.hatch.env]
requires = ["hatch-pip-compile==1.11.8"]

[tool.uv.workspace]
