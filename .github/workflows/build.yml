name: CI

# CI runs once per PR update (on GitHub's trial merge into main), on every push
# to main, and on `v*` tags. Branches without a PR can be run by hand
# (workflow_dispatch). A `v*` tag additionally creates a draft GitHub release
# carrying the wheel and sdist built here; publishing that draft triggers
# release.yml, which uploads those exact files to PyPI. Nothing downstream
# rebuilds.
on:
  push:
    branches: ["main"]
    # Required: once `branches` is set, tag pushes no longer trigger the
    # workflow unless listed, and draft-release would silently never run.
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same PR cancels its superseded run. Runs for main and
# tags are never cancelled, so a release build can't be killed mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Release-tag preflight, in its own job so it fails fast and in parallel with
  # the checks. Releases come only from main: a v* tag on any other commit (e.g.
  # an unmerged branch) would otherwise build a draft release. The checkout is
  # shallow, so fetch main's full history before asking whether the tagged
  # commit is reachable from it.
  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      # Python, uv, and Hatch (with hatch-pip-compile) from mise.toml, installed
      # from mise.lock and its .mise/locks sidecar (the action adds --locked when a
      # lockfile is present). Same pins as a developer machine; nothing
      # re-resolves. mise itself is pinned; the action is pinned by commit.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.9.15

      # Fail before the package is built if a release tag disagrees with the
      # version the packages would be stamped with.
      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(hatch version)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version (expected v$version)"
            exit 1
          fi

  # Everything in `hatch run release` except the tests, which run in `test`.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain (mise)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.9.15

      # `release` regenerates models.py from the pinned spec artifact. A diff
      # means the committed file is not what the pin generates. The `test`
      # jobs run against the committed file, so this check is what ties their
      # result to the generated one.
      - name: Generate models
        run: hatch run generate

      - name: Check that the committed models.py matches the generated one
        run: git diff --exit-code -- src/oscal_bindings/v1/models.py

      - name: Lint
        run: hatch run lint

      - name: Typing
        run: hatch run typing

      - name: Security
        run: hatch run security

      - name: Docs
        run: hatch run docs

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: api-docs
          path: build/api-docs/

  # One job per Python in the hatch-test matrix, run in parallel. Keep the list
  # in step with [[tool.hatch.envs.hatch-test.matrix]] in pyproject.toml.
  # Coverage is measured on the newest Python only (`cover`); keep that entry
  # in step with the Python in mise.toml.
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
          - python: "3.14"
            cover: true

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain (mise)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.9.15

      - name: Test
        env:
          PYTHON: ${{ matrix.python }}
          COVER: ${{ matrix.cover && '--cover' || '' }}
        run: hatch test $COVER --python "$PYTHON"

      # always(): keep partial output for debugging when a test fails.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.cover }}
        with:
          name: coverage-html
          path: htmlcov/

  # The one required status check (branch protection requires `build`). A job
  # whose `needs` failed is skipped, and a skipped required check counts as
  # passing, so this job runs regardless and fails itself if anything upstream
  # failed. It builds the packages only after every check and every Python in
  # the matrix has passed, so PyPI still gets files that were tested.
  build:
    needs: [tag-check, checks, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require upstream jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::An upstream job did not succeed"; exit 1 ;;
          esac

      - uses: actions/checkout@v5

      - name: Install toolchain (mise)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.9.15

      - name: Build wheel and sdist
        run: hatch build

      - name: Upload python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            build/*.whl
            build/*.tar.gz
          if-no-files-found: error

  # Signs build provenance for the wheel and sdist, binding each file digest to
  # this workflow, the commit, and the tag. release.yml verifies it before the
  # PyPI upload, so files that this job did not sign are refused. Only this job
  # holds id-token and attestations write.
  attest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  draft-release:
    # Needs attest so that a draft release never exists without attestations.
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its assets

    steps:
      - name: Download python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      # Draft only: a human reviews and publishes, which triggers release.yml.
      # --verify-tag refuses to create the tag if it is somehow missing.
      - name: Create draft release with packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
