name: CI

# CI runs once per PR update (on GitHub's trial merge into main), on every push
# to main, and on `v*` tags. Branches without a PR can be run by hand
# (workflow_dispatch). A `v*` tag additionally creates a draft GitHub release
# carrying the wheel and sdist built here; publishing that draft triggers
# release.yml, which uploads those exact files to PyPI. Nothing downstream
# rebuilds.
on:
  push:
    branches: ["main"]
    # Required: once `branches` is set, tag pushes no longer trigger the
    # workflow unless listed, and draft-release would silently never run.
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same PR cancels its superseded run. Runs for main and
# tags are never cancelled, so a release build can't be killed mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Releases come only from main: a v* tag on any other commit (e.g. an
      # unmerged branch) would otherwise build a draft release. The checkout is
      # shallow, so fetch main's full history before asking whether the tagged
      # commit is reachable from it. Runs first, before any expensive step.
      - name: Check tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      # Python, uv, and Hatch (with hatch-pip-compile) from mise.toml, installed
      # from mise.lock and its .mise/locks sidecar (the action adds --locked when a
      # lockfile is present). Same pins as a developer machine; nothing
      # re-resolves. mise itself is pinned; the action is pinned by commit.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
        with:
          version: 2026.9.15

      # Fail before the expensive steps if a release tag disagrees with the
      # version the packages would be stamped with.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(hatch version)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version (expected v$version)"
            exit 1
          fi

      # generate -> lint -> typing -> tests with coverage (3.11 + 3.12) -> docs
      - name: Release checks
        run: hatch run release

      - name: Build wheel and sdist
        run: hatch build

      # always(): keep partial output for debugging when an earlier step fails.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: api-docs
          path: build/api-docs/

      - name: Upload python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            build/*.whl
            build/*.tar.gz
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its assets

    steps:
      - name: Download python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      # Draft only: a human reviews and publishes, which triggers release.yml.
      # --verify-tag refuses to create the tag if it is somehow missing.
      - name: Create draft release with packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
